<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda de Avisos — Avisos</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="com-sidebar">

  <header>
    <div style="display:flex; align-items:center;">
      <h1>📋 Agenda de Avisos</h1>
      <span class="badge">Avisos</span>
    </div>
    <button class="btn btn-outline" onclick="window.location.href='index.html'">Sair</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav>
        <div class="nav-item" onclick="window.location.href='dashboard.html'">🏠 Início</div>
        <div class="nav-group">
          <div class="nav-label">Cadastros</div>
          <div class="nav-item sub" onclick="window.location.href='usuarios.html'">👤 Usuários</div>
          <div class="nav-item sub" onclick="window.location.href='pessoas.html'">👥 Pessoas</div>
          <div class="nav-item sub" onclick="window.location.href='tipos-aviso.html'">🏷️ Tipos de Aviso</div>
          <div class="nav-item sub active" onclick="window.location.href='avisos.html'">📢 Avisos</div>
        </div>
      </nav>
    </aside>

    <div class="conteudo">
      <div class="secao-header">
        <h2>📢 Avisos</h2>
        <button class="btn btn-primary" onclick="abrirModalNovo()">+ Novo Aviso</button>
      </div>

      <div class="secao">
        <table>
          <thead>
            <tr><th>#</th><th>Aviso</th><th>Destinatário</th><th>Tipo</th><th>Observação</th><th>Ações</th></tr>
          </thead>
          <tbody id="corpoTabela">
            <tr><td colspan="6" style="text-align:center;color:#999;">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>Desenvolvido por Luan Victor · Faculdade · 2026</footer>

  <div class="overlay" id="overlayModal">
    <div class="modal">
      <h2 id="modalTitulo">Novo Aviso</h2>
      <p class="subtitulo">Preencha os dados do aviso</p>
      <input type="hidden" id="avisoId"/>

      <label>Aviso *</label>
      <input type="text" id="inputAviso" placeholder="Descrição do aviso"/>

      <label>Destinatário</label>
      <select id="inputPessoa" class="modal-select">
        <option value="">Selecione...</option>
      </select>

      <label>Tipo de Aviso</label>
      <select id="inputTipo" class="modal-select">
        <option value="">Selecione...</option>
      </select>

      <label>Observação</label>
      <input type="text" id="inputObservacao" placeholder="Observação (opcional)"/>

      <p class="erro" id="erroModal"></p>

      <div class="modal-btns">
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        <button class="btn-entrar" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    carregarAvisos();
    carregarSelects();

    function carregarSelects() {
      fetch('/pessoas').then(r => r.json()).then(pessoas => {
        const sel = document.getElementById('inputPessoa');
        pessoas.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.pessoa_id;
          opt.textContent = p.nome;
          sel.appendChild(opt);
        });
      });

      fetch('/tipos-aviso').then(r => r.json()).then(tipos => {
        const sel = document.getElementById('inputTipo');
        tipos.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.aviso_tipo_id;
          opt.textContent = t.descricao;
          sel.appendChild(opt);
        });
      });
    }

    function carregarAvisos() {
      fetch('/avisos').then(r => r.json()).then(avisos => {
        const corpo = document.getElementById('corpoTabela');
        if (avisos.length === 0) {
          corpo.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">Nenhum aviso cadastrado</td></tr>';
          return;
        }
        corpo.innerHTML = avisos.map(a => `
          <tr>
            <td>${a.aviso_id}</td>
            <td>${a.aviso}</td>
            <td>${a.pessoa_nome || '-'}</td>
            <td>${a.tipo_descricao || '-'}</td>
            <td>${a.observacao || '-'}</td>
            <td>
              <button class="btn-acao btn-editar" onclick="abrirModalEditar(${a.aviso_id},'${a.aviso}','${a.pessoa_id || ''}','${a.aviso_tipo_id || ''}','${a.observacao || ''}')">✏️ Editar</button>
              <button class="btn-acao btn-excluir" onclick="excluir(${a.aviso_id})">🗑️ Excluir</button>
            </td>
          </tr>
        `).join('');
      });
    }

    function abrirModalNovo() {
      document.getElementById('modalTitulo').textContent = 'Novo Aviso';
      document.getElementById('avisoId').value = '';
      document.getElementById('inputAviso').value = '';
      document.getElementById('inputPessoa').value = '';
      document.getElementById('inputTipo').value = '';
      document.getElementById('inputObservacao').value = '';
      document.getElementById('erroModal').textContent = '';
      document.getElementById('overlayModal').classList.add('active');
    }

    function abrirModalEditar(id, aviso, pessoa_id, tipo_id, observacao) {
      document.getElementById('modalTitulo').textContent = 'Editar Aviso';
      document.getElementById('avisoId').value = id;
      document.getElementById('inputAviso').value = aviso;
      document.getElementById('inputPessoa').value = pessoa_id;
      document.getElementById('inputTipo').value = tipo_id;
      document.getElementById('inputObservacao').value = observacao;
      document.getElementById('erroModal').textContent = '';
      document.getElementById('overlayModal').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('overlayModal').classList.remove('active');
    }

    async function salvar() {
      const id = document.getElementById('avisoId').value;
      const aviso = document.getElementById('inputAviso').value.trim();
      const pessoa_id = document.getElementById('inputPessoa').value;
      const aviso_tipo_id = document.getElementById('inputTipo').value;
      const observacao = document.getElementById('inputObservacao').value.trim();

      if (!aviso) {
        document.getElementById('erroModal').textContent = 'Preencha o aviso!';
        return;
      }

      const url = id ? `/avisos/${id}` : '/avisos';
      const method = id ? 'PUT' : 'POST';

      const resposta = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ aviso, pessoa_id, aviso_tipo_id, observacao })
      });

      const dados = await resposta.json();
      if (!resposta.ok) {
        document.getElementById('erroModal').textContent = dados.erro;
      } else {
        fecharModal();
        carregarAvisos();
      }
    }

    async function excluir(id) {
      if (!confirm('Deseja excluir este aviso?')) return;
      const resposta = await fetch(`/avisos/${id}`, { method: 'DELETE' });
      const dados = await resposta.json();
      if (!resposta.ok) alert(dados.erro);
      else carregarAvisos();
    }

    document.getElementById('overlayModal').addEventListener('click', function(e) {
      if (e.target === this) fecharModal();
    });
  </script>

</body>
</html>
